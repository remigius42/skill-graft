# Mutants that cannot change what their pattern matches where skill-graft uses it, per
# target: `"<target>" = [{ operator = "...", offset = N, reason = "..." }]`. A listed
# mutant that is killed, or no longer exists, fails `python -m mutation`.

"vet._PATTERNS:unreviewable.long-line" = [
  { operator = "drop-anchor", offset = 0, reason = "a line holds no line feed: any 1001 characters start at its start too" },
]
"vet._PATTERNS:unreviewable.encoded-blob" = [
  { operator = "drop-class-item", offset = 1, reason = "compiled with IGNORECASE: a-z matches A-Z" },
  { operator = "drop-class-item", offset = 4, reason = "compiled with IGNORECASE: A-Z matches a-z" },
]
"vet._RM" = [
  { operator = "plus-to-star", offset = 19, reason = "adds only an empty run of options after `rm`, which is no removal, and consumes no later `rm`" },
]
"vet._CHMOD" = [
  { operator = "plus-to-star", offset = 40, reason = "adds only an empty mode, which is neither octal nor a clause" },
]
"vet._SYMBOLIC" = [
  { operator = "star-to-plus", offset = 22, reason = "drops only clauses adding nothing, which add neither `w` nor `s`" },
]
"vet._KEY" = [
  { operator = "plus-to-star", offset = 6, reason = "adds only an empty key, which no flagged key equals" },
]
"references.REFERENCE" = [
  { operator = "drop-possessive", offset = 182, reason = "the next character, a quote, space, `)` or `,`, is never a name character: giving one back cannot match" },
  { operator = "drop-possessive", offset = 207, reason = "only an optional `)` follows: backtracking finds no other end" },
  { operator = "drop-possessive", offset = 255, reason = "a backtick follows, never a name character: giving one back cannot match" },
  { operator = "drop-possessive", offset = 326, reason = "a run given back leaves a letter or digit next, which the lookahead refuses" },
  { operator = "drop-possessive", offset = 340, reason = "a run given back leaves a letter or digit next, which the lookahead refuses" },
  { operator = "drop-possessive", offset = 343, reason = "a segment given back leaves `-` next, which the lookahead refuses" },
]
"references.SENTENCE_END" = [
  { operator = "drop-branch", offset = 130, reason = "only whitespace lies between such an end and the window's limit, where the window then ends: it holds no name" },
  { operator = "star-to-plus", offset = 132, reason = "without whitespace the end is the limit itself, where the window then ends" },
]
"references.QUOTED_NAME" = [
  { operator = "drop-possessive", offset = 48, reason = "the closing quote follows, never a name character: giving one back cannot match" },
]
"vet._TOKEN" = [
  { operator = "plus-to-star", offset = 37, reason = "adds only empty tokens, which lead nowhere: no start outside, `normpath` gives `.`" },
]
