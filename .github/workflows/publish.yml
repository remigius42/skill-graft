name: Publish

# Uploads a release to PyPI, built from its signed tag: on the tag's push, or started by hand for a
# tag that already exists. The upload waits for the maintainer's approval in the `pypi` environment.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish, such as v0.4.0"
        required: true
        type: string

permissions:
  contents: read

# A push run and a manual run of one tag never upload at once.
concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Reaches the scripts only as a variable, never spliced into them.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything but a release tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf '::error::not a release tag v<major>.<minor>.<patch>: %q\n' "$TAG"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # Checkout leaves a lightweight tag on the commit; only the tag object holds the signature.
      - name: Verify the tag's signature against the README's key
        run: |
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          signers="$RUNNER_TEMP/allowed_signers"
          grep -m1 ' namespaces="git" ' README.md > "$signers" || {
            echo "::error::README.md at $TAG names no signing key"; exit 1; }
          git -c gpg.ssh.allowedSignersFile="$signers" verify-tag "$TAG" || {
            echo "::error::$TAG: no signature by the key README.md names"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")" ] || {
            echo "::error::$TAG moved: HEAD is not the verified tag's commit"; exit 1; }

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Nothing cached by other runs goes into a release.
          enable-cache: false

      - name: Check the tag names pyproject.toml's version
        run: |
          version="$(uv version --short)"
          [ "${TAG#v}" = "$version" ] || {
            echo "::error::$TAG names ${TAG#v}, pyproject.toml names $version"; exit 1; }

      - run: uv build --no-sources

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          # The sdist and the wheel only: uv build also writes a .gitignore there.
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/skill-graft/
    permissions:
      # Trusted publishing: PyPI trades this run's OIDC token for an upload token.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Uploads with PEP 740 attestations, which PyPI shows for each file. A re-run skips the files
      # PyPI already holds, so it completes an upload that stopped halfway.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
