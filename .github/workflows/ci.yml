name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # The pytest hooks call `uv run`; uv also fetches Python 3.11 for the oldest-Python run.
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure
