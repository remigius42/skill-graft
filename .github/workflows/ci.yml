name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pytest hooks call `uv run`; uv also fetches Python 3.11 for the oldest-Python run.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run pre-commit
        # A push to main checks out main, which no-commit-to-branch would refuse.
        # Not as root, where the tests relying on permissions skip: test-root covers root.
        env:
          SKIP: no-commit-to-branch
        run: |
          test "$(id -u)" -ne 0 || { echo "runs as root, where the tests relying on permissions skip" >&2; exit 1; }
          uv run pre-commit run --all-files --show-diff-on-failure

  # The suite once more, on macOS: the README states it as supported. Python 3.11 only, as the
  # pytest-py311 hook runs it; the pre-commit job already covers the newest Python on Linux.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run the tests
        # Not as root, where the tests relying on permissions skip.
        run: |
          test "$(id -u)" -ne 0 || { echo "runs as root, where the tests relying on permissions skip" >&2; exit 1; }
          uv run --isolated --python 3.11 --group dev pytest -q -p no:cacheprovider

  # The suite once more, as root, which ignores permissions: a test relying on them must skip there.
  # A container job runs as root. Debian trixie's git is 2.47, new enough for the no_lazy_fetch tests.
  test-root:
    runs-on: ubuntu-latest
    container: python:3.11-trixie@sha256:390127d66a75154671aa02f62a49aa7f83c386f33cdc84a8e8f060650e2e19f8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run the tests
        run: |
          test "$(id -u)" -eq 0
          uv run --isolated --python 3.11 --group dev pytest -q -p no:cacheprovider

  # The commitlint pre-commit hook lints only .git/COMMIT_EDITMSG, so this job calls commitlint on the
  # pushed or proposed commits instead, locked in .github/commitlint/: config-conventional at the hook's
  # version, the cli at the one the hook's range resolved to when locked.
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The node the hooks pin in .pre-commit-config.yaml; commitlint 21 needs 22.12 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      # The lockfile's integrity hashes, then the registry's signatures and attestations; no install scripts.
      - name: Install commitlint
        run: |
          npm ci --prefix .github/commitlint --ignore-scripts --no-audit --no-fund
          npm audit signatures --prefix .github/commitlint
          # commitlint.config.js looks for config-conventional in the root's node_modules.
          ln -s .github/commitlint/node_modules node_modules

      - name: Lint commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        # A new branch's `before` is all zeros, a forced push's may be missing: lint what the branch adds to main.
        run: |
          if ! git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            FROM=$(git merge-base origin/main "$TO")
          fi
          .github/commitlint/node_modules/.bin/commitlint --from "$FROM" --to "$TO" --verbose
