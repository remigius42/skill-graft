name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pytest hooks call `uv run`; uv also fetches Python 3.11 for the oldest-Python run.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run pre-commit
        # A push to main checks out main, which no-commit-to-branch would refuse.
        env:
          SKIP: no-commit-to-branch
        run: uv run pre-commit run --all-files --show-diff-on-failure

  # The commitlint pre-commit hook lints only .git/COMMIT_EDITMSG, so this job calls commitlint on the
  # pushed or proposed commits instead, at the versions that hook installs.
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        # A new branch's `before` is all zeros, a forced push's may be missing: lint what the branch adds to main.
        run: |
          if ! git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            FROM=$(git merge-base origin/main "$TO")
          fi
          npx --yes -p @commitlint/cli@20.5.0 -p @commitlint/config-conventional@20.5.0 -- \
            commitlint --from "$FROM" --to "$TO" --verbose
