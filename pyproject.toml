[project]
name = "skill-graft"
version = "0.2.2"
description = "Graft agent skills from other people's repositories onto your own setup"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "tomlkit>=0.15.2",
]

[project.scripts]
skill-graft = "skill_graft.cli:main"

[dependency-groups]
dev = [
  "apm-cli==0.33.0",
  "import-linter",
  "pre-commit",
  "pytest",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src", "tests"]

# For editors (Pylance, pyright); mypy above is the check pre-commit enforces. Standard, not strict: strict
# flags every value read from parsed TOML, which is untyped.
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportDeprecated = "warning"
venvPath = "."
venv = ".venv"
extraPaths = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "skill_graft"

[[tool.importlinter.contracts]]
name = "Each layer imports only the layers below it"
type = "layers"
containers = ["skill_graft"]
layers = ["cli", "commands", "pipeline", "infra"]
exhaustive = true
