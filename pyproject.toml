[project]
name = "skill-graft"
version = "0.1.0"
description = "Graft agent skills from other people's repositories onto your own setup"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "tomlkit>=0.15.2",
]

[project.scripts]
skill-graft = "skill_graft.cli:main"

[dependency-groups]
dev = [
  "apm-cli==0.33.0",
  "pre-commit",
  "pytest",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
