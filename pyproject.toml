[project]
name = "skill-graft"
version = "0.3.0"
description = "Graft agent skills from other people's repositories onto your own setup"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "tomlkit>=0.15.2",
]

[project.scripts]
skill-graft = "skill_graft.cli:main"

[dependency-groups]
dev = [
  "apm-cli==0.33.0",
  "import-linter>=2.15",
  # The mypy hook's version, so `uv run mypy` works in any checkout, worktrees included.
  "mypy==2.4.0",
  "pre-commit",
  "pytest",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# A global hides a dependency the import contracts cannot see (ADR 0008).
# W505: `ruff format` wraps code at 88 but never a docstring or comment.
extend-select = ["PLW0603", "W505"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src", "tests"]

# For editors (Pylance, pyright); mypy above is the check pre-commit enforces. Standard, not strict: strict
# flags every value read from parsed TOML, which is untyped.
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportDeprecated = "warning"
venvPath = "."
venv = ".venv"
extraPaths = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "skill_graft"

[[tool.importlinter.contracts]]
name = "Each layer imports only the layers below it"
type = "layers"
containers = ["skill_graft"]
layers = ["cli", "commands", "pipeline", "infra"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "cli reaches pipeline and infra only through commands"
type = "forbidden"
source_modules = ["skill_graft.cli"]
forbidden_modules = ["skill_graft.pipeline", "skill_graft.infra"]
ignore_imports = ["skill_graft.cli -> skill_graft.infra.errors"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "No import cycle between sibling modules or packages"
type = "acyclic_siblings"
ancestors = ["skill_graft"]
