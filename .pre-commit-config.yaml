# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# `.claude/` holds the OpenSpec skills and commands that `openspec init` generates.
# They are regenerated rather than edited, so no hook rewrites or lints them.
default_stages: [pre-commit]
exclude: ^\.claude/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          # Skill files open with YAML front matter. Without this, mdformat rewrites the
          # `---` fences into a horizontal rule and the skill stops parsing.
          - mdformat-frontmatter

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v9.6.0
    hooks:
      - id: cspell

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        # The hook's default args turn off checks; the strictness lives in pyproject.toml.
        args: []
        # The hook's environment lacks the project's dependencies: tomlkit for the code, pytest for
        # the tests.
        additional_dependencies:
          - pytest
          - tomlkit

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        types: [python]
      # Refuses an import that goes up a layer; the contract lives in pyproject.toml.
      - id: lint-imports
        name: lint-imports
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: ^(src/|pyproject\.toml$)
      # The oldest supported Python: 3.11 and 3.12 differ from newer ones in pathlib and shutil.
      - id: pytest-py311
        name: pytest (Python 3.11)
        entry: uv run --isolated --python 3.11 --group dev pytest -q -p no:cacheprovider
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.24.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"
