# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# `.claude/` holds the OpenSpec skills and commands that `openspec init` generates.
# They are regenerated rather than edited, so no hook rewrites or lints them.
default_stages: [pre-commit]
# The node the node hooks install from nodejs.org, the same everywhere: else pre-commit takes a system node
# if there is one, outside the home folder, and the newest nodejs.org lists if not, which may be a
# pre-release that fails to install.
default_language_version:
  node: 24.22.2
exclude: ^\.claude/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
      # Work happens on a branch; main only moves by fast-forward, which commits nothing.
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/hukkin/mdformat
    rev: 2d496dbc18e31b83a1596685347ffe0b6041daf0  # frozen: 1.0.0
    hooks:
      - id: mdformat
        # Wraps at markdownlint's MD013 limit, so a long line is fixed rather than refused.
        args: [--wrap=120]
        additional_dependencies:
          - mdformat-gfm==1.0.0
          # Skill files open with YAML front matter. Without this, mdformat rewrites the
          # `---` fences into a horizontal rule and the skill stops parsing.
          - mdformat-frontmatter==2.2.0

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: cbcdc463be5464e25e3e955a511599a67b9b987f  # frozen: v0.50.0
    hooks:
      - id: markdownlint

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: f6467e1f1ebecf5020560405c7b26e01786a43c8  # frozen: v10.4.0
    hooks:
      - id: cspell

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c  # frozen: v2.4.1
    hooks:
      - id: mypy
        # The hook's default args turn off checks; the strictness lives in pyproject.toml.
        args: []
        # The hook's environment lacks the project's dependencies: tomlkit for the code, pytest for
        # the tests, at the versions uv.lock holds.
        additional_dependencies:
          - pytest==9.1.1
          - tomlkit==0.15.2

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        types: [python]
      # Refuses an import that goes up a layer, or a cycle between siblings; the contracts
      # live in pyproject.toml.
      - id: lint-imports
        name: lint-imports
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: ^(src/|pyproject\.toml$)
      # The oldest supported Python: 3.11 and 3.12 differ from newer ones in pathlib and shutil.
      - id: pytest-py311
        name: pytest (Python 3.11)
        entry: uv run --isolated --python 3.11 --group dev pytest -q -p no:cacheprovider
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 1f1ac45c93d1c2ce36b71330252c489a5f4f2724  # frozen: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          # The version .github/commitlint/package-lock.json holds. The hook's own cli follows the range
          # its package.json sets, whatever its lockfile holds.
          - "@commitlint/config-conventional@21.2.4"
